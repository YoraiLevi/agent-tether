[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-tether"
version = "0.2.0"
description = "Durable, individually-addressable terminals for agent CLIs. A transparent shim that keeps your agent alive when the thing that launched it dies."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Yorai Levi" }]
keywords = ["zellij", "terminal", "session", "ai-agents", "claude-code", "codex", "tmux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "click>=8.1",
  "tomli>=2.0 ; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/YoraiLevi/agent-tether"
Issues = "https://github.com/YoraiLevi/agent-tether/issues"

[project.scripts]
tether = "tether.cli:main"
# Deliberately separate from `tether`: the shim path must not import click.
# See docs/DESIGN.md "Startup cost".
tether-shim = "tether.shim:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
# Listing the package is enough: hatchling ships everything under it,
# including src/tether/data. A force-include of the same tree would add each
# file twice and fail the build.
packages = ["src/tether"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
