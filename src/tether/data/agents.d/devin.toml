schema = 1
[agent]
name = "devin"
display_name = "Devin CLI"
verified = false
headless_flags = ["-p", "--print"]
info_flags = ["-h", "--help", "--version"]
# -p/--print is headless here; declaring it value-taking as well
# is contradictory (the headless check fires first regardless).
value_flags = ["-r", "--resume"]
resume_flag = "--resume"
resume_aliases = ["-r"]
notes = "Behaviour on a missing session id is UNKNOWN - probe before trusting restore."
