schema = 1

[agent]
name         = "codex"
display_name = "OpenAI Codex CLI"
verified     = true
install_hint = "npm i -g @openai/codex  (or the platform installer)"

# NOTE: top-level -p is --profile, NOT print. Listing it as headless would
# silently send interactive sessions down the pass-through lane.
headless_flags       = []
headless_subcommands = ["exec", "e", "review"]
info_flags           = ["-h", "--help", "-V", "--version"]
# `review` belongs in headless_subcommands only; listing it in both
# would leave one of the two rules dead code.
subcommands          = ["login", "logout", "mcp"]
# `codex resume <id>` is a subcommand that STARTS a session, so it must be
# tethered even though it looks like management traffic.
session_start_subcommands = ["resume"]
# Must list EVERY value-taking flag: a missing one makes the flag's value
# look like the subcommand. `codex --cd /repo exec ...` was mis-routed
# before --cd was listed here.
value_flags = ["-p", "--profile", "-m", "--model", "-c", "--config",
               "-C", "--cd", "--sandbox", "-a", "--ask-for-approval",
               "--image", "-i", "--oss"]

resume_subcommand = "resume"
transcript_dir    = "~/.codex/sessions"
notes = "No set-id flag: `codex --session-id x` errors with 'unexpected argument'. Restores are TERMINAL ONLY unless the id is captured after launch."
